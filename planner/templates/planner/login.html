{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | TravelAI</title>

    <link rel="stylesheet"
          href="{% static 'planner/css/style.css' %}">

    <style>

        .login-page {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #111522;
            border: 1px solid #252b3c;
            border-radius: 22px;
            padding: 38px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .login-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: linear-gradient(
                135deg,
                #7047ff,
                #994cff
            );
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .login-card h1 {
            text-align: center;
            color: white;
            font-size: 30px;
            margin: 0 0 8px;
        }

        .login-subtitle {
            text-align: center;
            color: #858da1;
            margin-bottom: 30px;
        }

        .login-form label {
            display: block;
            color: #b9c1d2;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .login-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #2b3143;
            background: #191e2d;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .login-form input:focus {
            border-color: #7047ff;
        }

        .login-error {
            background: rgba(220, 53, 69, 0.12);
            border: 1px solid rgba(220, 53, 69, 0.4);
            color: #ff8c98;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .login-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 11px;
            background: linear-gradient(
                135deg,
                #7047ff,
                #994cff
            );
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .login-info {
            text-align: center;
            color: #858da1;
            font-size: 13px;
            margin-top: 22px;
        }

    </style>

</head>


<body>

    <!-- NAVIGATION -->

    <nav class="navbar">

        <div class="logo">

            <span class="logo-icon">✈</span>

            <span>
                Travel<span class="logo-ai">AI</span>
            </span>

        </div>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/#features">
                Features
            </a>

            <a href="/#how-it-works">
                How It Works
            </a>

            <a href="/admin/">
                Admin
            </a>

        </div>

    </nav>


    <!-- LOGIN -->

    <main class="login-page">

        <div class="login-card">

            <div class="login-icon">
                ✈️
            </div>

            <h1>
                Welcome Back
            </h1>

            <p class="login-subtitle">
                Login to continue planning your trip
            </p>


            {% if error %}

            <div class="login-error">
                {{ error }}
            </div>

            {% endif %}


            <form method="POST"
                  class="login-form">

                {% csrf_token %}

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit"
                        class="login-btn">

                    Login to TravelAI →

                </button>

            </form>


            <p class="login-info">
                Use your Django account credentials
                to access your trip planner.
            </p>

        </div>

    </main>

</body>

</html>
